<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1a"><title>《理》刹那30 プレイテスト</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#080d1a;color:#eaf2ff}*{box-sizing:border-box}body{margin:0;max-width:850px;margin-inline:auto;padding:12px 12px 90px}header{position:sticky;top:0;background:#080d1aef;z-index:3;padding:8px 0;border-bottom:1px solid #34445c}h1{font-size:21px;margin:0 0 8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat,.card,.toolbar,.notice{border:1px solid #2d4059;border-radius:10px;background:#101a2a;padding:11px}.stat b{display:block;color:#7df0c6;font-size:17px;overflow-wrap:anywhere}.stat small,.hint{color:#a8b9d2;font-size:12px}button,select{background:#1b3650;color:#eaf2ff;border:1px solid #487c9a;border-radius:8px;padding:10px;font:inherit;touch-action:manipulation}button:disabled{opacity:.35}.tap{width:100%;font-size:23px;background:radial-gradient(circle,#254d75,#14263d);height:118px;margin:12px 0;border:1px solid #70b4e6}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}.toolbar button.active{background:#1c7664}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:9px}.card h3{margin:0;font-size:16px}.card p{font-size:12px;color:#bdcbe0;margin:7px 0}.card .line{display:flex;justify-content:space-between;gap:8px;align-items:center}.card button{width:100%;margin-top:7px}.badge{color:#7df0c6;font-size:11px}.notice{margin:10px 0;color:#c4d5e9}details{font-size:12px;color:#cbd8eb;margin-top:8px}summary{cursor:pointer}footer{margin:25px 0;font-size:12px;color:#a8b9d2}a{color:#8bcfff}
</style></head><body>
<header><h1>《理》 刹那30 · プレイテスト</h1><div class="stats"><div class="stat"><small>オーブ</small><b id="wallet">0</b></div><div class="stat"><small>タップ獲得量</small><b id="tapRate">1</b></div><div class="stat"><small>源（試験生産）/秒</small><b id="sourceRate">0</b></div><div class="stat"><small>収束回数</small><b id="cycles">0</b></div></div></header>
<button class="tap" id="tap">◉ 光に干渉する</button>
<div class="toolbar"><span>購入：</span><button data-mode="1" class="active">×1</button><button data-mode="10">×10</button><button data-mode="NEXT">NEXT</button><button data-mode="MAX">MAX</button><select id="notation" aria-label="数値表記"><option value="normal">整数優先</option><option value="scientific">科学表記</option><option value="japanese">日本語単位</option></select></div>
<div class="toolbar"><button id="converge">収束（テスト：1e6オーブ）</button><button id="source">源の試験生産を強化</button><button id="backup">セーブ書出し</button><button id="restore">セーブ読込</button><input id="file" type="file" accept=".json,application/json" hidden></div>
<div class="notice" id="status">本編とは独立した検証用セーブです。固有効果の倍率・発動条件の細部は暫定です。</div>
<section class="grid" id="cards"></section>
<footer>Ver.3.7 刹那仕様テスト。30項目、節目、固有効果、NEXT/MAX、収束を検証します。通常版の kotowari_v31_normal は読み書きしません。<a href="./index.html">本編へ戻る</a></footer>
<script type="module">
import {A,seriesCost,maxAffordable,formatAmount} from "./numbers.mjs";
const KEY="kotowari_setsuna_playtest_v1",N=30,ROM=["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ","Ⅶ","Ⅷ","Ⅸ","Ⅹ","Ⅺ","Ⅻ","ⅩⅢ","ⅩⅣ","ⅩⅤ","ⅩⅥ","ⅩⅦ","ⅩⅧ","ⅩⅨ","ⅩⅩ","ⅩⅪ","ⅩⅫ","ⅩⅩⅢ","ⅩⅩⅣ","ⅩⅩⅤ","ⅩⅩⅥ","ⅩⅩⅦ","ⅩⅩⅧ","ⅩⅩⅨ","ⅩⅩⅩ"];
const EFFECTS={2:["E01","共鳴","隣接強化を増幅"],5:["E07","生産転写","源生産をタップに反映"],8:["E11","連撃増幅","連続タップの倍率を強化"],12:["E03","集束干渉","最強の刹那強化を増幅"],15:["E08","瞬間加速","タップ回数で源生産を一時加速"],18:["E14","多重干渉","追加タップ判定"],21:["E12","連撃延長","コンボ維持時間を延長"],24:["E16","偶発増幅","低確率の高倍率タップ"],27:["E18","刹那の昂揚","一時的なタップ倍率"],29:["E19","源の昂揚","一時的な源生産倍率"]};
const milestones=[10,25,50,100,250,500,1000];for(let k=2500;k<=100000000;k*=2){milestones.push(k);milestones.push(k*2);if(k>1e7)break;k*=2.5;}const MS=[...new Set(milestones)].sort((a,b)=>a-b);
const G=[A(1)],C=[A(10)];for(let i=1;i<N;i++){const mult=i<5?3:i<10?5:i<20?7:10;G.push(G[i-1].mul(mult));const ratio=.8-(i-1)*.4/28;C.push(G[i].mul(10*ratio));}
const fresh=()=>({levels:Array(N).fill(0),earned:Array(N).fill(0),wallet:"0",cycles:0,permanent:0,sourceLevel:0,mode:"1",notation:"normal",taps:0,combo:0,lastTap:0,boostUntil:0});
let s=fresh();try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.levels?.length===N&&v.earned?.length===N)s={...fresh(),...v}}catch(e){}
const $=id=>document.getElementById(id),note=t=>$("status").textContent=t;
function fmt(x){const a=A(x);if(s.notation==="scientific")return formatAmount(a,2,"exponent");if(s.notation==="japanese"&&a.e>=4){const units=["","万","億","兆","京","垓","秭","穣","溝","澗","正","載","極"];const ix=Math.floor(a.e/4);if(ix<units.length)return (a.m*10**(a.e-ix*4)).toFixed(2)+units[ix]}return formatAmount(a,2,"auto")}
function kind(m){return m<100?"small":m<1000?"mid":"large"}
function tier(m){if(m<100)return 2;if(m<1000)return 3;return 5+Math.max(0,Math.floor(Math.log10(m/1000)))}
function bonuses(i){let own=A(1),global=0;for(const m of MS){if(m>s.earned[i])break;const k=kind(m);own=own.mul(tier(m));if(k==="mid")global+=.02;if(k==="large")global+=.05}return {own,global}}
function effectLevel(i){return s.levels[i]>0&&EFFECTS[i]?1:0}
function sourcePerSecond(){let r=A(s.sourceLevel).mul(2);if(effectLevel(15)&&Date.now()<s.boostUntil)r=r.mul(2);if(effectLevel(29))r=r.mul(1.2);return r}
function tapValue(){let base=A(1),global=1;const all=s.levels.map((_,i)=>bonuses(i));for(let i=0;i<N;i++){let amount=G[i].mul(s.levels[i]).mul(all[i].own);if(effectLevel(2)&&Math.abs(i-2)===1)amount=amount.mul(1.25);if(effectLevel(12)&&i===s.levels.indexOf(Math.max(...s.levels)))amount=amount.mul(1.5);base=base.add(amount);global+=all[i].global}
if(effectLevel(5))base=base.add(sourcePerSecond().mul(.1));if(effectLevel(8)&&s.combo>1)global*=1+Math.min(s.combo,30)*.01;if(effectLevel(27)&&Date.now()-s.lastTap<3000)global*=1.25;return base.mul(global).mul(1+s.permanent*.05)}
function quote(i){const lv=s.levels[i],remaining=Number.MAX_SAFE_INTEGER-lv;let count=s.mode==="1"?1:s.mode==="10"?10:s.mode==="NEXT"?(MS.find(m=>m>lv)||lv+100000)-lv:remaining;count=Math.min(count,remaining);if(s.mode==="MAX")count=maxAffordable(s.wallet,C[i],1.75,lv,remaining);else if(s.mode==="10"||s.mode==="NEXT")count=maxAffordable(s.wallet,C[i],1.75,lv,count);if(count<=0)return {count:0,cost:A(0)};return {count,cost:seriesCost(C[i],1.75,lv,count)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){note("保存できません。書出しでバックアップしてください。")}}
function buy(i){const q=quote(i);if(!q.count)return;const w=A(s.wallet);if(w.cmp(q.cost)<0)return;s.wallet=w.sub(q.cost).toString();s.levels[i]+=q.count;s.earned[i]=Math.max(s.earned[i],s.levels[i]);save();render()}
function render(){const rate=tapValue();$("wallet").textContent=fmt(s.wallet);$("tapRate").textContent=fmt(rate);$("sourceRate").textContent=fmt(sourcePerSecond());$("cycles").textContent=s.cycles;document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===s.mode));$("notation").value=s.notation;
$("cards").innerHTML=Array.from({length:N},(_,i)=>{const q=quote(i),effect=EFFECTS[i],ms=MS.find(m=>m>s.levels[i]),unlocked=i===0||s.levels[i-1]>0;const b=bonuses(i);return '<article class="card"><div class="line"><h3>強化'+ROM[i]+'</h3><span class="badge">Lv.'+s.levels[i].toLocaleString("ja-JP")+'</span></div><p>毎Lv +'+fmt(G[i])+' / タップ · 自身×'+fmt(b.own)+'</p><p>次の節目 '+(ms||"追加予定")+' · '+(effect?"✦ "+effect[1]:"通常強化")+'</p>'+(effect?'<details><summary>✦ '+effect[0]+' 詳細</summary>'+effect[2]+'（試験倍率）</details>':"")+'<button data-buy="'+i+'" '+(!unlocked||!q.count?"disabled":"")+'>購入 '+(q.count?"+"+q.count+" / "+fmt(q.cost):"資源不足")+'</button></article>'}).join("")}
$("tap").onclick=()=>{const now=Date.now();s.combo=now-s.lastTap<(effectLevel(21)?2500:1200)?s.combo+1:1;s.lastTap=now;s.taps++;let gain=tapValue();if(effectLevel(18)&&Math.random()<.1)gain=gain.mul(2);if(effectLevel(24)&&Math.random()<.01)gain=gain.mul(10);if(effectLevel(15)&&s.taps%20===0)s.boostUntil=now+5000;if(effectLevel(27))gain=gain.mul(1.25);s.wallet=A(s.wallet).add(gain).toString();save();render()};
$("cards").onclick=e=>{const b=e.target.closest("[data-buy]");if(b)buy(Number(b.dataset.buy))};
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{s.mode=b.dataset.mode;save();render()});$("notation").onchange=e=>{s.notation=e.target.value;save();render()};
$("source").onclick=()=>{const cost=A(100).mul(A(2).pow(s.sourceLevel));if(A(s.wallet).cmp(cost)<0){note("源の試験生産：必要 "+fmt(cost));return}s.wallet=A(s.wallet).sub(cost).toString();s.sourceLevel++;save();render()};
$("converge").onclick=()=>{if(A(s.wallet).cmp("1e6")<0){note("収束には1,000,000オーブ必要です");return}if(!confirm("収束しますか？ 刹那レベルを初期化し、テスト用永続倍率を獲得します。"))return;s.wallet="0";s.levels=Array(N).fill(0);s.earned=Array(N).fill(0);s.sourceLevel=0;s.cycles++;s.permanent++;save();render()};
$("backup").onclick=()=>{const blob=new Blob([JSON.stringify({kind:"setsuna-playtest",data:s},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="setsuna-playtest-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$("restore").onclick=()=>$("file").click();$("file").onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.kind!=="setsuna-playtest"||data.data.levels?.length!==N)throw Error("形式不正");if(!confirm("検証セーブを上書き復元しますか？"))return;s={...fresh(),...data.data};save();render()}catch(err){note("復元失敗："+err.message)}};
setInterval(()=>{if(s.sourceLevel>0){s.wallet=A(s.wallet).add(sourcePerSecond().div(5)).toString();save()}render()},200);render();
</script></body></html>
