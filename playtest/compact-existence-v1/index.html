<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101322"><title>理｜存在・成長試験</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="app">
<header><div><strong>理</strong><span class="trial">存在・独立試験版</span></div><a href="../../">通常版へ</a></header>
<div id="warning" role="status" hidden></div>
<section class="resources"><div><small>存在</small><strong id="existence">1</strong></div><div><small>オーブ</small><strong id="orbs">0</strong></div><div><small>毎秒生成</small><strong id="production">0</strong></div></section>
<section class="hero"><div id="gain" aria-live="off"></div><button id="orb" aria-label="オーブを獲得"><span class="core"></span></button><div class="hero-info"><span id="tapRate"></span><span id="combo"></span></div><div class="unlock-line"><span id="unlockLabel"></span><progress id="unlockProgress" max="100" value="0"></progress></div></section>
<nav id="tabs" aria-label="強化"><button data-tab="moment" aria-pressed="true">刹那</button><button data-tab="source">？？？</button><button data-tab="engraving">？？？</button><button data-tab="auto">自動化</button></nav>
<section id="toolbar"><button id="mode" title="購入数を切り替える">MAX</button><button id="priority">高グレード順</button><button id="bulk" disabled>一括購入</button></section>
<section id="panel" aria-label="選択中の強化"></section>
<footer><div class="converge"><div><strong id="convergenceLabel">？？？</strong><small id="convergenceProgress"></small></div><button id="converge" disabled>収束</button></div><details id="testTools"><summary>試験操作・保存</summary><p>通常版のセーブとは独立しています。ここで追加した資源は通常版に反映されません。</p><div class="grant"><select id="grantKind" aria-label="試験資源"><option value="orbs">オーブ</option><option value="existence">余剰存在</option></select><input id="grantValue" value="1000000" inputmode="text" aria-label="追加数"><button id="grantButton">追加</button></div><button id="reset" class="danger">試験データだけリセット</button><p class="fine">暫定価格・効果・順序。源＋は収束でリセットする試験条件。時・宇宙・生命・BOOST・旧セーブ移行は対象外。端末を閉じている間は進行しません。</p></details></footer>
</main><script type="module" src="./ui.mjs"></script></body></html>
