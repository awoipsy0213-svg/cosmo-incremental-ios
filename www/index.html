<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="理">
<title>《理》</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./neon-icon-192.png">
<link rel="icon" href="./neon-icon-192.png">
<link rel="stylesheet" href="./organic-original.css">
<link rel="stylesheet" href="./mobile.css">
<link rel="stylesheet" href="./neon-theme.css">
<link rel="stylesheet" href="./live-ui.css">
<link rel="stylesheet" href="./astral-observatory.css">
<link rel="stylesheet" href="./stage-worlds.css">
<link rel="stylesheet" href="./matrix-v324.css">
<link rel="stylesheet" href="./luminous-glass-v332.css">
<link rel="stylesheet" href="./fixed-layout-v333.css">
<link rel="stylesheet" href="./automation-center-v336.css">
<link rel="stylesheet" href="./purchase-row-v338.css">
<link rel="stylesheet" href="./purchase-clarity-v339.css">
<link rel="stylesheet" href="./time-hex-v341.css">
<link rel="stylesheet" href="./engraving-v342.css">
<link rel="stylesheet" href="./time-growth-v350.css">
<link rel="stylesheet" href="./ux-polish-v355.css">
</head>
<body class="kw-app">
<div id="appRoot">
  <div class="app-top">
    <div class="brand"><span class="brand-mark">理</span><span class="brand-caption">KOTOWARI<span id="buildLabel" hidden aria-hidden="true">3.56</span></span></div>
    <div id="activeStageTitle" class="active-stage-title">ステージ · 存在</div>
    <div class="run-indicator" aria-label="収束した回数"><span>収束</span><strong id="hudRunCount">0</strong></div>
    <div class="top-actions"><span id="saveIndicator" role="status" aria-label="保存状態">準備中</span><button class="icon-button" data-action="organizer" aria-label="設定と保存を開く">≡</button></div>
  </div>
  <div id="noticeBar" class="notice-bar" role="status" hidden><span id="noticeText"></span><button data-action="dismiss-notice" aria-label="案内を閉じる">×</button></div>
  <div id="updateBar" class="update-bar" hidden><span>最新版を利用できます</span><button data-action="update">保存して再起動</button></div>
  <section id="commonInfoBar" class="common-info-bar" aria-label="全ステージ共通の進行情報" hidden>
  <button class="common-info-item" type="button" data-action="open-common-info" aria-label="存在の詳細"><svg class="shared-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="2"/></svg><span class="common-info-copy"><small>存在</small><strong data-common-value="existence">0</strong></span></button>
  <button class="common-info-item" type="button" data-action="open-common-info" aria-label="時間の経過速度の詳細"><svg class="shared-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/></svg><span class="common-info-copy"><small>時間の経過速度</small><strong data-common-value="timeSpeed">×1</strong></span></button>
</section>
  <main id="world" class="world">
    <header class="world-header">
      <span id="stageKicker" class="stage-kicker">STAGE 01</span>
      <h1 id="stageTitle">存在</h1>
      <div class="stage-hud">
        <div class="stage-hud-primary"><span id="stageResourceLabel" class="stage-resource-label">オーブ</span><div id="primaryValue" class="primary-value">0</div><div id="worldDetails" class="world-details"></div></div>
        <div id="stageResourceList" class="stage-resource-list" aria-label="このステージの主要な数値"></div>
      </div>
    </header>
    <section class="world-matrix" aria-label="現在のステージ進行">
      <strong id="matrixCaption">理のマトリクス</strong>
      <small id="matrixSummary">強化した種類 0 / 60</small>
      <span class="matrix-meter" aria-hidden="true"><i id="matrixFill"></i></span>
    </section>
    <div class="world-sideboards" hidden aria-hidden="true">
      <section class="scene-sidebar"><h3>観測ログ</h3><div id="worldObserve" class="scene-side-content"></div></section>

    </div>
    <div id="touchField" class="cosmic-scene" role="button" tabindex="0" aria-label="浮遊する光に干渉する">
      <div class="starfield" aria-hidden="true"></div>
      <div class="cosmic-halo" aria-hidden="true"></div>
      <div class="cosmic-motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="stage-backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="matrix-hero" aria-hidden="true">
        <div class="matrix-hero-orbit"></div>
        <div class="matrix-hero-orbit second"></div>
        <div class="matrix-hero-cube"><span id="heroSigil">理</span></div>
        <div class="matrix-hero-base"></div>
        <div class="matrix-spark spark-a"></div><div class="matrix-spark spark-b"></div><div class="matrix-spark spark-c"></div>
      </div>
      <svg class="flow-art" viewBox="0 0 360 390" aria-hidden="true"><defs><radialGradient id="aura"><stop offset="0" stop-color="#f9faff" stop-opacity=".95"/><stop offset=".12" stop-color="#dceeff" stop-opacity=".75"/><stop offset=".45" stop-color="#906dff" stop-opacity=".18"/><stop offset="1" stop-color="#48cfff" stop-opacity="0"/></radialGradient><linearGradient id="silk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65baff" stop-opacity="0"/><stop offset=".45" stop-color="#c6d9ff" stop-opacity=".8"/><stop offset="1" stop-color="#a47aff" stop-opacity="0"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="5"/></filter></defs><g class="flow-rotate"><ellipse cx="180" cy="195" rx="124" ry="124" fill="none" stroke="#8dbbff" stroke-width=".5" opacity=".17"/><ellipse cx="180" cy="195" rx="82" ry="82" fill="none" stroke="#8dbbff" stroke-width=".5" opacity=".22"/><path d="M-35 278 C95 300 95 40 225 80 S380 245 410 130" fill="none" stroke="url(#silk)" stroke-width="25" opacity=".26" filter="url(#soft)"/><path d="M-30 278 C95 300 95 40 225 80 S380 245 410 130" fill="none" stroke="url(#silk)" stroke-width="1.4" opacity=".8"/><path d="M-35 125 C125 40 230 360 390 250" fill="none" stroke="url(#silk)" stroke-width="34" opacity=".18" filter="url(#soft)"/><path d="M-35 125 C125 40 230 360 390 250" fill="none" stroke="url(#silk)" stroke-width="1.2" opacity=".65"/><path d="M-20 195 C115 380 250 -30 400 190" fill="none" stroke="url(#silk)" stroke-width="13" opacity=".21" filter="url(#soft)"/><path d="M-20 195 C115 380 250 -30 400 190" fill="none" stroke="url(#silk)" stroke-width=".9" opacity=".65"/></g><circle cx="180" cy="195" r="100" fill="url(#aura)"/><circle cx="180" cy="195" r="18" fill="#ecf9ff" opacity=".9" filter="url(#soft)"/><circle cx="180" cy="195" r="9" fill="#fafdff"/></svg>
      <div id="uxGrowthAura" aria-hidden="true"></div><div id="uxPulse" aria-hidden="true"></div>
      <div id="timeHexRoot" class="time-hex-root" hidden></div>
       <div id="waves" aria-hidden="true"></div>
      <div id="uxGain" aria-hidden="true" hidden><strong id="uxGainValue"></strong><small id="uxGainEffects"></small></div>
    </div>
    <section id="stageIdentityPanel" class="stage-identity-panel" hidden aria-label="惑星観測と操作"></section>
    <div class="world-bottom"><p id="worldHint" class="world-hint" hidden></p><button id="convergeMain" class="converge-button" data-action="converge" hidden></button></div>
  </main>
  <aside id="sheet" class="kw-sheet" data-state="closed" aria-label="ステージ操作パネル" hidden>
    <div id="sheetHandle" class="kw-sheet-heading"><div><span class="sheet-overline">CONTROLS</span><h2 id="sheetHeading">刹那</h2></div><div class="sheet-buttons"><button id="purchaseCycle" class="buy-mode-cycle" data-action="cycle-buy-mode" aria-label="購入数を切り替える" title="購入数を切り替えます" hidden>×1</button><button class="icon-button" data-action="expand" aria-label="リストを全表示" id="expandButton">↗</button><button class="icon-button" data-action="collapse-sheet" aria-label="パネルを収納">⌄</button></div></div>
    <div class="child-tab-strip" id="childTabStrip">
      <nav id="childTabs" class="child-tabs" aria-label="ステージ内タブ"></nav>
      <div id="purchaseToolbar" class="purchase-toolbar purchase-toolbar-compact" hidden>
        <button id="bulkBuyButton" type="button" data-action="buy-all" aria-label="現在のタブを一括購入" title="現在のタブを一括購入">一括</button>
        <button id="bulkScopeButton" type="button" data-action="toggle-bulk-scope" aria-label="全件を対象に一括購入" title="全件を対象に一括購入">全件</button>
        <button id="bulkOrderButton" type="button" data-action="toggle-bulk-order" aria-label="安い順で一括購入" title="安い順で一括購入">安い順</button>
        <span id="purchaseLiveSummary" class="purchase-live-summary" aria-live="off"></span>
      </div>
    </div>
    <div id="sheetBody" class="kw-sheet-body" tabindex="-1"></div>
  </aside>
  <nav id="stageNav" class="stage-nav" aria-label="ステージ切り替え" hidden></nav>
  <dialog id="organizerDrawer" class="organizer-drawer"><div class="drawer-head"><div><small>WORLD ORGANIZER</small><h2>管理</h2></div><button class="icon-button" data-action="close-drawer" aria-label="管理メニューを閉じる">×</button></div><div id="organizerLinks"></div><div class="drawer-foot">《理》 · KOTOWARI</div></dialog>
  <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle" aria-describedby="confirmText"><h2 id="confirmTitle"></h2><p id="confirmText" tabindex="0"></p><div class="dialog-actions"><button id="confirmNo" type="button" autofocus>戻る</button><button id="confirmYes" type="button">実行する</button></div></dialog>
  <div id="birthOverlay" class="birth-overlay" aria-hidden="true"><span>存在 <b>1</b></span></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <section id="uxNotice" aria-labelledby="uxNoticeTitle" hidden><div class="ux-notice-head"><span id="uxNoticeIcon" aria-hidden="true"></span><div><h2 id="uxNoticeTitle" role="status"></h2><p id="uxNoticeCondition"></p></div></div><ul id="uxNoticeLines"></ul><div class="ux-notice-actions"><button id="uxNoticeLater" type="button">あとで</button><button id="uxNoticeSource" type="button" hidden>源を開く</button><button id="uxNoticeOpen" type="button">開く</button></div></section>
  <noscript>このゲームにはJavaScriptが必要です。</noscript>
</div>
<script type="module" src="./app.mjs"></script>
</body></html>
