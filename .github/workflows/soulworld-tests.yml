name: Soul World tests
on:
  push:
    paths:
      - 'soulworld/**'
      - '.github/workflows/soulworld-tests.yml'
  pull_request:
    paths:
      - 'soulworld/**'
      - '.github/workflows/soulworld-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Soul World browser modules
        run: |
          node --check soulworld/game.mjs
          node --check soulworld/core.mjs
          node --check soulworld/hero-progression.mjs
          node --check soulworld/save-migration.mjs
          node --check soulworld/hero-roster.mjs
          node --check soulworld/base-progression.mjs
          node --check soulworld/combat-foundation.mjs
          node --check soulworld/scene.mjs
          node --check soulworld/base-progression.mjs
          node --check soulworld/scene.mjs
          node --check soulworld/fallback.mjs
      - name: Run Soul World tests
        run: node --test soulworld/tests/*.test.mjs
