name: Soul World tests
on:
  push:
    paths:
      - 'soulworld/**'
      - '.github/workflows/soulworld-tests.yml'
  pull_request:
    paths:
      - 'soulworld/**'
      - '.github/workflows/soulworld-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Soul World tests
        run: node --test soulworld/tests/*.test.mjs
