name: Compact campaign regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/v357_compact_campaign.mjs
      - run: npm install --no-save --ignore-scripts @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: node tests/v357_compact_campaign_browser.mjs
