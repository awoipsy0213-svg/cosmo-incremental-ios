name: Kotowari v3.9 regression
on:
  push:
    branches: [main]
    paths: ['game.mjs', 'setsuna-rules-v39.mjs', 'content.mjs', 'save.mjs', 'balance-config.mjs', 'tests/**', 'www/**', 'luminous-glass-v332.css', 'fixed-layout-v333.css', 'index.html', 'sw.js', 'package.json', '.github/workflows/kotowari-v39.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: |
          for f in game.mjs app.mjs purchase-clarity-v339.mjs purchase-preview-v338.mjs content.mjs moment-filter.mjs time-confirmed-v4.mjs universe-confirmed-v4.mjs universe-progression-v316.mjs engraving-rules-v317.mjs engraving-effects-v333.mjs universe-interference-v318.mjs telemetry-v319.mjs sw.js; do
            node --check "$f" || exit 1
          done
      - run: |
          for f in game.mjs app.mjs purchase-clarity-v339.mjs purchase-preview-v338.mjs content.mjs moment-filter.mjs balance-config.mjs setsuna-rules-v39.mjs save.mjs time-confirmed-v4.mjs universe-confirmed-v4.mjs universe-progression-v316.mjs engraving-rules-v317.mjs engraving-effects-v333.mjs universe-interference-v318.mjs telemetry-v319.mjs astral-observatory.css stage-worlds.css matrix-v324.css luminous-glass-v332.css fixed-layout-v333.css automation-center-v336.css purchase-row-v338.css purchase-clarity-v339.css; do
            cmp "$f" "www/$f" || exit 1
          done
          cmp index.html www/index.html
          cmp sw.js www/sw.js

  browser-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: npm install --no-save @playwright/test
      - name: Install Chromium and runtime libraries
        run: npx playwright install --with-deps chromium
      - name: Smoke-test Web UI in desktop and mobile Chromium
        run: |
          node tests/v355_ux_polish_browser.mjs
          node tests/v3541_pwa_upgrade_browser.mjs
          node tests/v354_stage_unlock_browser.mjs
          node tests/v353_save_reset_browser.mjs
          node tests/v344_existence_display_browser.mjs
          node tests/v343_purchase_priority_browser.mjs
          node tests/v342_engraving_browser.mjs
          node tests/v340_source_milestones_browser.mjs
          node tests/v339_purchase_clarity_browser.mjs
          node tests/v338_compact_purchase_browser.mjs
          node tests/v337_automation_master_browser.mjs
          node tests/v336_automation_browser.mjs
          node tests/v335_player_copy_browser.mjs
          node tests/v333_engraving_browser.mjs
          node tests/v333_fixed_browser.mjs
          node tests/v332_luminous_browser.mjs
          node tests/v318_browser_smoke.mjs
          node tests/v323_ui_browser.mjs
          node tests/v324_matrix_browser.mjs
          node tests/v324_r2_confirm_browser.mjs
          node tests/v325_boost_browser.mjs
          node tests/v326_confirmed_browser.mjs
          node tests/v330_playtest_browser.mjs
          node tests/v331_ui_flow_browser.mjs
          node tests/v329_confirmed_browser.mjs
          node tests/v328_confirmed_browser.mjs
          node tests/v327_time_only_browser.mjs
          node tests/v320_browser_recovery.mjs
      - name: Upload luminous UI phone/tablet screenshots and density metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v333-fixed-ui-pr
          path: |
            artifacts/ui-v332/
            artifacts/ui-v333/
          if-no-files-found: ignore
          retention-days: 14
