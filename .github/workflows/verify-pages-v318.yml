name: Verify published Kotowari Web
on:
  push:
    branches: [main]
    # Verify all main updates; even stylesheet-only releases must be checked.
  workflow_dispatch:
jobs:
  published-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages deployment of this exact main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Waiting for Pages deployment of ${GITHUB_SHA}"
          for n in $(seq 1 60); do
            runs="$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")"
            result="$(jq -r --arg sha "${GITHUB_SHA}" \
              '[.workflow_runs[] | select(.name=="pages build and deployment" and .head_sha==$sha)] | sort_by(.id) | last | .conclusion // "pending"' <<< "${runs}")"
            case "${result}" in
              success) echo "PASS Pages deployed ${GITHUB_SHA}"; break ;;
              failure|cancelled|timed_out|action_required|skipped|stale)
                echo "FAIL Pages deployment status: ${result}" >&2; exit 1 ;;
              *) echo "Pages deployment not finished: ${result}, attempt ${n}/60" ;;
            esac
            if [ "${n}" -eq 60 ]; then echo "FAIL Pages deployment did not finish" >&2; exit 1; fi
            sleep 10
          done
      - name: Compare live source files with checked-out main SHA
        env:
          KOTOWARI_SMOKE_BASE_URL: https://awoipsy0213-svg.github.io/cosmo-incremental-ios/
        run: node scripts/verify-published.mjs
      - name: Verify live stage graphics are accessible
        run: |
          curl -fsSL --retry 4 --retry-delay 3 https://awoipsy0213-svg.github.io/cosmo-incremental-ios/stage-worlds.css | grep -q "kw-time-turn"
      - name: Verify Fixed Geometry stylesheet is available
        run: |
          curl -fsSL --retry 4 --retry-delay 3 https://awoipsy0213-svg.github.io/cosmo-incremental-ios/fixed-layout-v333.css | grep -q "fixed-geometry mobile UI"
      - name: Verify Automation Center stylesheet is available
        run: |
          curl -fsSL --retry 4 --retry-delay 3 https://awoipsy0213-svg.github.io/cosmo-incremental-ios/automation-center-v336.css | grep -q "automation-quick"
      - name: Verify high-contrast upgrade stylesheet is available
        run: |
          curl -fsSL --retry 4 --retry-delay 3 https://awoipsy0213-svg.github.io/cosmo-incremental-ios/purchase-clarity-v339.css | grep -q "v3.39"
      - name: Verify dense purchase stylesheet is available
        run: |
          curl -fsSL --retry 4 --retry-delay 3 https://awoipsy0213-svg.github.io/cosmo-incremental-ios/purchase-row-v338.css | grep -q "dense-purchase-button"
      - name: Verify Luminous Glass stylesheet is available
        run: |
          curl -fsSL --retry 4 --retry-delay 3 https://awoipsy0213-svg.github.io/cosmo-incremental-ios/luminous-glass-v332.css | grep -q "Luminous Glass"
      - name: Verify Matrix UI stylesheet is available
        run: |
          curl -fsSL --retry 4 --retry-delay 3 https://awoipsy0213-svg.github.io/cosmo-incremental-ios/matrix-v324.css | grep -q "matrix-hero-cube"
      - name: Verify live source effects module is accessible
        run: |
          curl -fsSL --retry 4 --retry-delay 3 https://awoipsy0213-svg.github.io/cosmo-incremental-ios/source-effects-v315.mjs | grep -q "SOURCE_EFFECT_MILESTONES"
      - name: Verify live statistics module is accessible
        run: |
          curl -fsSL --retry 4 --retry-delay 3 https://awoipsy0213-svg.github.io/cosmo-incremental-ios/telemetry-v319.mjs | grep -q 'consecutiveOrbGains'
      - name: Verify live game engine module is accessible
        run: |
          curl -fsSL --retry 4 --retry-delay 3             https://awoipsy0213-svg.github.io/cosmo-incremental-ios/game.mjs             | grep -q 'collidePlanets'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install remote Web smoke dependencies
        run: npm install --no-save @playwright/test
      - name: Install Chromium for public-site checks
        run: npx playwright install --with-deps chromium
      - name: Exercise the published game in desktop and mobile Chromium
        env:
          KOTOWARI_SMOKE_BASE_URL: https://awoipsy0213-svg.github.io/cosmo-incremental-ios/
        run: |
          node tests/v355_ux_polish_browser.mjs
          node tests/v354_stage_unlock_browser.mjs
          node tests/v353_save_reset_browser.mjs
          node tests/v344_existence_display_browser.mjs
          node tests/v343_purchase_priority_browser.mjs
          node tests/v342_engraving_browser.mjs
          node tests/v340_source_milestones_browser.mjs
          node tests/v339_purchase_clarity_browser.mjs
          node tests/v338_compact_purchase_browser.mjs
          node tests/v337_automation_master_browser.mjs
          node tests/v336_automation_browser.mjs
          node tests/v335_player_copy_browser.mjs
          node tests/v333_engraving_browser.mjs
          node tests/v333_fixed_browser.mjs
          node tests/v332_luminous_browser.mjs
          node tests/v318_browser_smoke.mjs
          node tests/v323_ui_browser.mjs
          node tests/v324_matrix_browser.mjs
          node tests/v324_r2_confirm_browser.mjs
          node tests/v325_boost_browser.mjs
          node tests/v326_confirmed_browser.mjs
          node tests/v330_playtest_browser.mjs
          node tests/v331_ui_flow_browser.mjs
          node tests/v329_confirmed_browser.mjs
          node tests/v328_confirmed_browser.mjs
          node tests/v327_time_only_browser.mjs
          node tests/v320_browser_recovery.mjs
      - name: Upload published luminous UI screenshots and density metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v333-fixed-ui-published
          path: |
            artifacts/ui-v332/
            artifacts/ui-v333/
          if-no-files-found: ignore
          retention-days: 14
