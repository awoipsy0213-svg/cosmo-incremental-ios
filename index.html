<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060c24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="理">
<title>《理》— 星雲ネオン Ver.3.11</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./neon-icon-192.png">
<link rel="icon" href="./neon-icon-192.png">
<link rel="stylesheet" href="./organic-original.css">
<link rel="stylesheet" href="./mobile.css">
<link rel="stylesheet" href="./neon-theme.css">
<link rel="stylesheet" href="./live-ui.css">
</head>
<body class="kw-app">
<div id="appRoot">
  <div class="app-top">
    <div class="brand"><span class="brand-mark">理</span><span class="brand-caption">KOTOWARI<br><span id="buildLabel">3.11 · 刹那30</span></span></div>
    <div class="top-actions"><span id="saveIndicator" role="status" aria-label="保存状態">準備中</span><button class="icon-button" data-action="organizer" aria-label="設定と保存を開く">≡</button></div>
  </div>
  <div id="noticeBar" class="notice-bar" role="status" hidden><span id="noticeText"></span><button data-action="dismiss-notice" aria-label="案内を閉じる">×</button></div>
  <div id="updateBar" class="update-bar" hidden><span>更新版を受信しました</span><button data-action="update">保存して更新</button></div>
  <main id="world" class="world">
    <header class="world-header">
      <span id="stageKicker" class="stage-kicker">STAGE 01</span>
      <h1 id="stageTitle">存在</h1>
      <div id="primaryValue" class="primary-value">1.000</div>
      <div id="worldDetails" class="world-details"></div>
    </header>
    <div id="touchField" class="cosmic-scene" role="button" tabindex="0" aria-label="浮遊する光に干渉する">
      <div class="starfield" aria-hidden="true"></div>
      <div class="cosmic-halo" aria-hidden="true"></div>
      <div class="cosmic-motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <svg class="flow-art" viewBox="0 0 360 390" aria-hidden="true"><defs><radialGradient id="aura"><stop offset="0" stop-color="#f9faff" stop-opacity=".95"/><stop offset=".12" stop-color="#dceeff" stop-opacity=".75"/><stop offset=".45" stop-color="#906dff" stop-opacity=".18"/><stop offset="1" stop-color="#48cfff" stop-opacity="0"/></radialGradient><linearGradient id="silk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65baff" stop-opacity="0"/><stop offset=".45" stop-color="#c6d9ff" stop-opacity=".8"/><stop offset="1" stop-color="#a47aff" stop-opacity="0"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="5"/></filter></defs><g class="flow-rotate"><ellipse cx="180" cy="195" rx="124" ry="124" fill="none" stroke="#8dbbff" stroke-width=".5" opacity=".17"/><ellipse cx="180" cy="195" rx="82" ry="82" fill="none" stroke="#8dbbff" stroke-width=".5" opacity=".22"/><path d="M-35 278 C95 300 95 40 225 80 S380 245 410 130" fill="none" stroke="url(#silk)" stroke-width="25" opacity=".26" filter="url(#soft)"/><path d="M-30 278 C95 300 95 40 225 80 S380 245 410 130" fill="none" stroke="url(#silk)" stroke-width="1.4" opacity=".8"/><path d="M-35 125 C125 40 230 360 390 250" fill="none" stroke="url(#silk)" stroke-width="34" opacity=".18" filter="url(#soft)"/><path d="M-35 125 C125 40 230 360 390 250" fill="none" stroke="url(#silk)" stroke-width="1.2" opacity=".65"/><path d="M-20 195 C115 380 250 -30 400 190" fill="none" stroke="url(#silk)" stroke-width="13" opacity=".21" filter="url(#soft)"/><path d="M-20 195 C115 380 250 -30 400 190" fill="none" stroke="url(#silk)" stroke-width=".9" opacity=".65"/></g><circle cx="180" cy="195" r="100" fill="url(#aura)"/><circle cx="180" cy="195" r="18" fill="#ecf9ff" opacity=".9" filter="url(#soft)"/><circle cx="180" cy="195" r="9" fill="#fafdff"/></svg>
      <div id="waves" aria-hidden="true"></div>
    </div>
    <div class="world-bottom"><p id="worldHint" class="world-hint">光に触れる</p><button id="convergeMain" class="converge-button" data-action="converge" hidden></button></div>
  </main>
  <aside id="sheet" class="kw-sheet" data-state="closed" aria-label="ステージ操作パネル" hidden>
    <div id="sheetHandle" class="kw-sheet-heading"><div><span class="sheet-overline">CONTROLS</span><h2 id="sheetHeading">刹那</h2></div><div class="sheet-buttons"><button id="purchaseCycle" class="buy-mode-cycle" data-action="cycle-buy-mode" aria-label="購入数を切り替える" title="購入数を切り替えます" hidden>×1</button><button class="icon-button" data-action="expand" aria-label="リストを全表示" id="expandButton">↗</button><button class="icon-button" data-action="collapse-sheet" aria-label="パネルを収納">⌄</button></div></div>
    <nav id="childTabs" class="child-tabs" aria-label="ステージ内タブ"></nav>
    <div id="purchaseToolbar" class="purchase-toolbar purchase-toolbar-compact" hidden><button id="bulkBuyButton" type="button" data-action="buy-all" aria-label="現在のタブの強化を一括購入">一括購入</button><button id="bulkOrderButton" type="button" data-action="toggle-bulk-order" aria-label="一括購入の優先順位を切り替える">安い順 ▾</button><span class="toolbar-spacer"></span><span class="trial-mark">価格・効果は暫定</span><span id="purchaseLiveSummary" class="purchase-live-summary" aria-live="off">購入状況を計算中</span></div>
    <div id="sheetBody" class="kw-sheet-body" tabindex="-1"></div>
  </aside>
  <nav id="stageNav" class="stage-nav" aria-label="ステージ切り替え" hidden></nav>
  <dialog id="organizerDrawer" class="organizer-drawer"><div class="drawer-head"><div><small>WORLD ORGANIZER</small><h2>管理</h2></div><button class="icon-button" data-action="close-drawer" aria-label="管理メニューを閉じる">×</button></div><div id="organizerLinks"></div><div class="drawer-foot">VERSION 3.9.0<br>刹那30固有効果・一括購入・コンパクトUI</div></dialog>
  <dialog id="confirmDialog" class="confirm-dialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="dialog-actions"><button id="confirmNo">戻る</button><button id="confirmYes">実行する</button></div></dialog>
  <div id="birthOverlay" class="birth-overlay" aria-hidden="true"><span>存在 <b>1</b></span></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>このゲームにはJavaScriptが必要です。</noscript>
</div>
<script type="module" src="./app.mjs"></script>
</body></html>
