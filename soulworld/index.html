<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#142932">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="魂の世界：試作版">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./premium.css">
<title>魂の世界 | 2頭身ファンタジー育成 Ver.0.2.2</title>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="3Dゲームフィールド"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="tip" id="tip">キャラクターをタップすると可愛がれます</div>
  <header class="topbar">
    <div class="user-info glass"><img class="crest" src="./hero-portrait.svg" alt="メインキャラクターの顔"><div class="user-lines"><strong>魂の世界 <span class="test-label">PREMIUM PROTOTYPE 0.2</span></strong><small id="stage-label">拠点 Rank 1</small></div></div>
    <div class="wallet"><span class="wallet-item"><i>✦</i> <b id="gem-top">0</b> <small>試験ジェム</small></span><span class="wallet-item"><i>◈</i> <b id="temple-top">0</b> <small>未回収Pt</small></span></div>
    <button id="btn-battle-pause" class="icon-btn glass hidden" aria-label="戦闘を一時停止">Ⅱ</button><button id="menu-open" class="icon-btn glass" aria-label="メニュー">☰</button>
  </header>
  <aside id="side-log" class="glass side-log"><div class="section-head"><b>世界の記録</b><button id="log-toggle" class="mini-btn" aria-label="ログの開閉">‹</button></div><div id="logs" class="logs"></div><div class="panel-foot">生命の記録は世界に残ります</div></aside>
  <aside class="resources glass" id="resource-panel"><div class="section-head"><b>資源</b><button class="mini-btn" id="resources-toggle">—</button></div><div id="resource-list"></div></aside>
  <div id="world-labels" aria-hidden="true"></div>
  <div id="stage-hud" class="stage-hud glass hidden" aria-live="off"></div>
  <div id="battle-top" class="battle-top glass hidden"><div class="balance-label"><b>味方</b><span>均衡ゲージ（試作）</span><b>敵</b></div><div class="balance"><span id="balance-ally"></span><span id="balance-enemy"></span></div><div class="battle-subline"><span id="battle-clock">残り 05:00</span><span id="battle-hp">拠点 100 / 100</span><span id="battle-mana">マナ 0 / 100</span></div></div>
  <div class="controls-left"><button class="menu-action" id="btn-stage"><span class="big-emoji">🧭</span><span>ステージ</span></button><button class="menu-action" id="btn-build"><span class="big-emoji">🔨</span><span>建築</span></button><button class="menu-action" id="btn-terrain"><span class="big-emoji">🌿</span><span>地形</span></button></div>
  <div class="bottom-status glass"><button class="hero-chip" id="btn-hero"><img class="hero-portrait" src="./hero-portrait.svg" alt="メインキャラクター"><span><small>メイン</small><strong>英雄</strong></span><span class="heart-icon">♥ <b id="fav-main">0</b></span></button><span class="status-divider"></span><span class="sub-count"><small>サブ</small><strong id="sub-count">0 / 5</strong></span><div id="sub-avatar-strip" class="sub-avatar-strip" aria-label="活動中のサブキャラクター"></div><span class="status-divider"></span><button class="hero-chip sub-chip" id="btn-sub"><img class="sub-face" src="./sub-portrait.svg" alt="サブキャラクター"><span><small>なつき度</small><strong id="fav-sub">0</strong></span></button></div>
  <div class="command-area"><div class="command-head">指示コントローラー <span id="wheel-stage">育成</span></div><div class="wheel"><button class="sector north" id="cmd-north"><span id="north-icon">🌱</span><b id="north-name">環境</b><small id="north-num">2</small></button><button class="sector east" id="cmd-east"><span id="east-icon">⚔</span><b id="east-name">戦闘</b><small id="east-num">0</small></button><button class="sector south" id="cmd-south"><span id="south-icon">🏠</span><b id="south-name">拠点</b><small id="south-num">2</small></button><button class="sector west" id="cmd-west"><span id="west-icon">✧</span><b id="west-name">自由</b><small id="west-num">1</small></button><button class="wheel-center" id="wheel-center"><span>指示</span><strong id="wheel-total">5</strong><small>編集</small></button></div></div>
  <div id="selection" class="selection glass hidden"><div class="selection-top"><div><strong id="selected-name">サブ #1</strong><small id="selected-detail">木を運搬中</small></div><button class="mini-btn" id="close-selection">×</button></div><div class="life-track"><span id="life-progress"></span></div><div class="selection-actions"><button id="pet-btn">♡ 可愛がる</button><button id="follow-btn">◎ 追尾する</button></div></div>
  <div class="quick-actions"><button id="btn-temple" class="glass">✧ 神殿 <span id="temple-quick">0 Pt</span></button><button id="btn-reset-camera" class="glass">⟲ 視点を戻す</button></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <div class="modal-backdrop hidden" id="modal-backdrop"><div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">メニュー</h2><button class="icon-btn close" id="modal-close" aria-label="閉じる">×</button></div><div id="modal-body" class="modal-body"></div></div></div>
  <div class="rotate-hint"><div>↻</div><strong>横画面にしてプレイしてください</strong><small>スマートフォンは横向きが推奨です</small></div>
</div>
<input type="file" accept="application/json,.json" id="import-file" hidden>
<script type="module" src="./game.mjs"></script>
</body>
</html>
